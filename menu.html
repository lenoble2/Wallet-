<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu - Lean</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #f8f9fc;
            --card-bg: #ffffff;
            --text-color: #1a1a1a;
            --icon-bg: #eef2f8;
            --icon-color: #3b5998;
            --border-color: #f0f0f0;
            --danger-color: #e74c3c;
            --primary-color: #002080;
            --success-color: #27ae60;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Style du badge KYC */
        #kyc-badge {
            margin-top: 5px;
            font-size: 12px;
            font-weight: bold;
            padding: 4px 10px;
            border-radius: 15px;
            display: inline-block;
        }
        .badge-valide { background-color: #d4edda; color: var(--success-color); }
        .badge-non-initie { background-color: #e2e3e5; color: #6c757d; }

        .top-nav {
            width: 100%;
            background: white;
            padding: 15px 20px;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }

        .btn-back-dashboard {
            text-decoration: none;
            color: var(--primary-color);
            font-weight: 600;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 15px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            transition: background 0.3s;
        }

        .btn-back-dashboard:hover {
            background: var(--bg-color);
        }

        .menu-container {
            width: 90%;
            max-width: 400px;
            padding-bottom: 30px;
        }

        .profile-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #ddd;
            margin-bottom: 10px;
            object-fit: cover;
        }

        .user-name {
            font-size: 18px;
            font-weight: bold;
            color: var(--text-color);
            margin: 5px 0 0 0;
        }

        .menu-item {
            background-color: var(--card-bg);
            display: flex;
            align-items: center;
            padding: 15px;
            margin-bottom: 12px;
            border-radius: 12px;
            text-decoration: none;
            color: var(--text-color);
            transition: transform 0.2s, background-color 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
        }

        .menu-item:active {
            transform: scale(0.98);
            background-color: #f0f0f0;
        }

        .icon-box {
            width: 40px;
            height: 40px;
            background-color: var(--icon-bg);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
        }

        .icon-box i {
            color: var(--icon-color);
            font-size: 18px;
        }

        .menu-text {
            flex-grow: 1;
            font-weight: 600;
            font-size: 15px;
        }

        .chevron {
            color: #ccc;
            font-size: 14px;
        }

        .logout-btn {
            margin-top: 30px;
            border: 2px solid var(--danger-color) !important;
            color: var(--danger-color) !important;
            background: transparent !important;
            justify-content: center !important;
            cursor: pointer;
        }

        .logout-btn i {
            margin-right: 10px;
        }

        .footer {
            margin-top: auto;
            padding: 20px;
            text-align: center;
        }

        .footer p {
            font-size: 11px;
            color: #888;
            margin: 5px 0;
        }
    </style>
</head>
<body>

    <nav class="top-nav">
        <a href="dashboard.html" class="btn-back-dashboard">
            <i class="fas fa-th-large"></i> Dashboard
        </a>
    </nav>

    <div class="menu-container">
        <header class="profile-header">
            <img src="https://cdn-icons-png.flaticon.com/512/149/149071.png" alt="Profile" class="avatar">
            <h2 id="display-user-name" class="user-name">Utilisateur</h2>
            <div id="kyc-badge">Chargement...</div>
        </header>

        <a href="verification.html" class="menu-item">
            <div class="icon-box"><i class="fas fa-user-shield"></i></div>
            <div class="menu-text">Sécurité</div>
            <div class="chevron"><i class="fas fa-chevron-right"></i></div>
        </a>

        <a href="historique.html" class="menu-item">
            <div class="icon-box"><i class="fas fa-history"></i></div>
            <div class="menu-text">Historique</div>
            <div class="chevron"><i class="fas fa-chevron-right"></i></div>
        </a>

        <a href="support.html" class="menu-item">
            <div class="icon-box"><i class="fas fa-headset"></i></div>
            <div class="menu-text">Service client</div>
            <div class="chevron"><i class="fas fa-chevron-right"></i></div>
        </a>

        <a href="kyc.html" class="menu-item">
            <div class="icon-box"><i class="fas fa-id-card"></i></div>
            <div class="menu-text">Vérification KYC</div>
            <div class="chevron"><i class="fas fa-chevron-right"></i></div>
        </a>

        <a href="#" id="btn-deconnexion" class="menu-item logout-btn">
            <i class="fas fa-sign-out-alt"></i>
            <div class="menu-text">Déconnexion</div>
        </a>
    </div>

    <div class="footer">
        <p>© 2024 - 2026 Lean, v3.5.1</p>
        <p>Développé par LENOBLE STUDIO</p>
    </div>


<script>
    async function checkKycStatus() {
        const userId = localStorage.getItem('userId');
        const badge = document.getElementById('kyc-badge');
        
        if (!userId) {
            badge.textContent = "NON_CONNECTE";
            badge.className = "badge-non-initie";
            return;
        }

        // Essayer d'utiliser l'URL locale si vous êtes sur le même réseau
        // Sinon, gardez votre URL Render
        const API_BASE = "https://lean3.onrender.com"; 

        try {
            const res = await fetch(`${API_BASE}/api/user/info?id=${userId}`);
            
            if (!res.ok) throw new Error("Erreur réseau");
            
            const data = await res.json();

            if (data.user) {
                const status = data.user.statut_kyc ? data.user.statut_kyc.toUpperCase() : "NON_INITIE";
                
                badge.textContent = status;
                badge.className = (status === 'VALIDE') ? "badge-valide" : "badge-non-initie";
            } else {
                badge.textContent = "NON_INITIE";
                badge.className = "badge-non-initie";
            }
        } catch (e) {
            console.error("Erreur:", e);
            // Si l'API échoue, on affiche au moins le statut stocké localement si disponible
            const cachedStatus = localStorage.getItem('statut_kyc');
            badge.textContent = cachedStatus ? cachedStatus.toUpperCase() : "NON_INITIE";
            badge.className = (cachedStatus === 'valide') ? "badge-valide" : "badge-non-initie";
        }
    }

    window.onload = () => {
        const userName = localStorage.getItem('userName');
        if (userName) document.getElementById('display-user-name').textContent = userName;
        checkKycStatus();
    };

    document.getElementById('btn-deconnexion').addEventListener('click', (e) => {
        e.preventDefault();
        localStorage.clear();
        window.location.href = "index.html";
    });
</script>

</body>
</html>
