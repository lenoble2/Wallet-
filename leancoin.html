<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bientôt disponible - Leanpay</title>
    <style>
        /* Styles de base pour centrer le contenu et imiter la mise en page de l'app */
        body {
            font-family: Arial, sans-serif;
            background-color: white;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background-color: white;
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        .title {
            font-size: 20px;
            font-weight: bold;
            color: #333;
            margin-top: 20px;
            margin-bottom: 30px;
        }

        /* Style spécifique pour le bouton Leanpay */
        .btn-leanpay {
            background-color: #007bff; /* Bleu Leanpay (aproximatif, ajustable) */
            color: white;
            text-decoration: none;
            padding: 15px 40px;
            font-size: 16px;
            border-radius: 100px; /* Coins très arrondis comme sur l'image */
            display: inline-block;
            cursor: pointer;
            border: none;
            transition: background-color 0.2s ease;
        }

        .btn-leanpay:hover {
            background-color: #0056b3; /* Bleu plus foncé au survol */
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Affichage de l'image modifiée -->
        <img src="images/lean.png" alt="Personnage assis avec téléphone" style="width: 100%; height: auto; display: block;">

        <div class="title">Bientôt disponible</div>

        <!-- Le bouton 'Quitter', modifié en bleu Leanpay et lié à dashboard.html -->
        <a href="dashboard.html" class="btn-leanpay">Quitter</a>
    </div>

</body>
</html>
