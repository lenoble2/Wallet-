<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin - LeanPay</title>
    <style>
        :root {
            --primary: #00008B;
            --accent: #ffcc00;
            --bg: #f8f9fa;
            --text: #333;
            --danger: #d63031;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 20px;
            color: var(--text);
        }

        .admin-container {
            max-width: 100%;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--primary);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .header h1 {
            color: var(--primary);
            margin: 0;
            font-size: 1.5em;
        }

        .stats-bar {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: var(--primary);
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 0.9em;
        }

        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 0.85em;
        }

        thead {
            background-color: var(--primary);
            color: white;
        }

        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        tr:hover {
            background-color: #f1f1f1;
        }

        .img-preview {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 4px;
            cursor: pointer;
            border: 1px solid #ddd;
            transition: 0.2s;
        }

        .img-preview:hover {
            transform: scale(2);
            z-index: 10;
            position: relative;
        }

        .status-pill {
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.8em;
            font-weight: bold;
            text-transform: uppercase;
        }

        .status-en_attente { background: #ffeaa7; color: #d35400; }
        .status-valide { background: #c8e6c9; color: #2e7d32; }
        .status-rejete { background: #ffcdd2; color: #c62828; }

        .btn-refresh {
            background: var(--accent);
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }

        .pin-code {
            font-family: monospace;
            background: #eee;
            padding: 2px 5px;
            border-radius: 3px;
            color: var(--danger);
        }

        .action-btn {
            border: none;
            background: none;
            font-size: 1.2em;
            cursor: pointer;
            padding: 2px 5px;
            transition: 0.2s;
        }

        .action-btn:hover {
            transform: scale(1.2);
        }

.action-btn {
    padding: 10px;
    margin: 5px;
    font-size: 18px; /* Agrandit l'icône pour le doigt */
    cursor: pointer;
    border: none;
    background: #f0f0f0;
    border-radius: 8px;
}

    </style>
</head>
<body>

<div class="admin-container">
    <div class="header">
        <h1>LeanPay | Gestion des Utilisateurs</h1>
        <button class="btn-refresh" onclick="loadAllUsers()">🔄 Actualiser</button>
    </div>

    <div class="stats-bar">
        <div class="stat-card" id="total-users">Total : --</div>
        <div class="stat-card" style="background: #27ae60;" id="valid-kyc">KYC Validés : --</div>
    </div>

    <div class="table-responsive">
        <table id="userTable">
            <thead>
                <tr>
                    <th>ID / Phone</th>
                    <th>Nom</th>
                    <th>Email</th>
                    <th>PIN</th>
                    <th>Solde (XOF)</th>
                    <th>Statut KYC</th>
                    <th>Pièce Recto</th>
                    <th>Selfie</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="userList">
                <tr>
                    <td colspan="9" style="text-align:center;">Chargement des données...</td>
                </tr>

<tbody id="userList"></tbody>

            </tbody>
        </table>
    </div>
</div>

<script>
const API_URL = window.location.origin;

async function loadAllUsers() {
    const tbody = document.getElementById('userList');
    if (!tbody) return;

    try {
        const response = await fetch(`${API_URL}/api/admin/all-users`);
        const data = await response.json();

        if (!data.success) throw new Error("Erreur serveur");

        document.getElementById('total-users').innerText = `Total : ${data.users.length}`;
        document.getElementById('valid-kyc').innerText = `KYC Validés : ${data.users.filter(u => u.statut_kyc === 'valide').length}`;

        tbody.innerHTML = '';

        data.users.forEach(user => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><b>${user.id}</b></td>
                <td>${user.nom || '---'}</td>
                <td>${user.email || '---'}</td>
                <td><span class="pin-code">${user.pin || '----'}</span></td>
                <td>${parseFloat(user.solde || 0).toLocaleString()}</td>
                <td><span class="status-pill status-${user.statut_kyc}">${user.statut_kyc}</span></td>
                <td>
                    ${user.photo_piece_recto ? `<img src="${user.photo_piece_recto}" class="img-preview" onclick="window.open(this.src)">` : '❌'}
                </td>
                <td>
                    ${user.photo_selfie ? `<img src="${user.photo_selfie}" class="img-preview" onclick="window.open(this.src)">` : '❌'}
                </td>
                <td>
                    <button class="action-btn" title="Valider KYC" onclick="changeStatus('${user.id}', 'valide')">✅</button>
                    <button class="action-btn" title="Rejeter KYC" onclick="changeStatus('${user.id}', 'rejete')">🚫</button>
                    <button class="action-btn" title="Réinitialiser PIN" onclick="resetPin('${user.id}')">🔑</button>
                </td>
            `;
            tbody.appendChild(tr);
        });

    } catch (error) {
        console.error(error);
        tbody.innerHTML = '<tr><td colspan="9" style="text-align:center; color:red;">Erreur de chargement des données.</td></tr>';
    }
}

async function changeStatus(userId, status) {
    if(!confirm(`Confirmer le passage du KYC en statut : ${status} ?`)) return;
    try {
        const res = await fetch(`${API_URL}/api/admin/update-kyc-status`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ userId, status })
        });
        if(res.ok) loadAllUsers();
    } catch (e) { alert("Erreur de mise à jour"); }
}

async function resetPin(userId) {
    if(!confirm("Réinitialiser le code PIN de cet utilisateur à 0000 ?")) return;
    try {
        const response = await fetch(`${API_URL}/api/admin/reset-pin`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ userId })
        });
        const data = await response.json();
        if(data.success) {
            alert("PIN réinitialisé avec succès à 0000");
            loadAllUsers();
        } else {
            alert("Erreur: " + data.message);
        }
    } catch (e) {
        alert("Erreur lors de la communication avec le serveur");
    }
}

window.onload = loadAllUsers;
</script>

</body>
</html>
