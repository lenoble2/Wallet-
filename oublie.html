<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Récupérer mon PIN - Lean Pay</title>
    <style>
        /* Style adapté pour mobile (Android/iOS) */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 400px;
            text-align: center;
        }

        h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5rem;
        }

        input[type="email"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box; 
            font-size: 16px; 
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:active {
            background-color: #0056b3;
            transform: scale(0.98);
        }

        /* Style pour le bouton Retour */
        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #666;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: #007bff;
        }

        #message {
            margin-top: 15px;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="container">
    
    <h2>Récupérer mon PIN</h2>
    
    <form id="forgotForm">
        <input type="email" id="email" placeholder="votre@email.com" required>
        <button type="submit" id="submitBtn">Recevoir mon code par mail</button>
    </form>

    <div id="message"></div>

    <a href="index.html" class="back-link">← Retour à la connexion</a>
</div>

<script>
    document.getElementById('forgotForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const email = document.getElementById('email').value;
        const submitBtn = document.getElementById('submitBtn');
        const messageDiv = document.getElementById('message');

        submitBtn.disabled = true;
        submitBtn.innerText = "Envoi en cours...";
        messageDiv.innerText = "";

        fetch('https://lean3.onrender.com/api/recuperer-pin', { 
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({ email: email.trim() }),
        })
        .then(response => {
            if (!response.ok) {
                return response.json().then(err => { throw new Error(err.message) });
            }
            return response.json();
        })
        .then(data => {
            if (data.success) {
                messageDiv.style.color = "green";
                messageDiv.innerText = "Succès : " + data.message;
            } else {
                messageDiv.style.color = "red";
                messageDiv.innerText = data.message || "Erreur lors de l'envoi.";
            }
        })
        .catch(error => {
            console.error('Erreur:', error);

messageDiv.style.color = "red";
            messageDiv.innerText = error.message === "Failed to fetch" 
                ? "Impossible de joindre le serveur. Vérifiez votre URL Render." 
                : error.message;
        })
        .finally(() => {
            submitBtn.disabled = false;
            submitBtn.innerText = "Recevoir mon code par mail";
        });
    });
</script>

</body>
</html>
